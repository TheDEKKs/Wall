<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wall - Стена пользователя</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --eva-purple: #9933ff;
            --eva-orange: #ff6600;
            --eva-green: #00ff00;
            --eva-red: #ff0000;
            --bg-dark: #0a0a0a;
            --bg-darker: #000000;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --text-muted: #666666;
            --border-color: #333333;
            --warning-yellow: #ffff00;
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--bg-darker);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
        }

        .eva-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(153, 51, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(153, 51, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        /* Loading State */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-darker);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid var(--border-color);
            border-top-color: var(--eva-purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 1.5rem;
            font-size: 1rem;
            letter-spacing: 0.2rem;
            color: var(--text-muted);
        }

        /* Error State */
        .error-container {
            background: rgba(255, 0, 0, 0.1);
            border: 2px solid var(--eva-red);
            padding: 3rem 2rem;
            text-align: center;
            margin: 4rem auto;
            max-width: 600px;
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.2rem;
            margin-bottom: 1rem;
            color: var(--eva-red);
        }

        .error-message {
            color: var(--text-secondary);
            letter-spacing: 0.1rem;
        }

        /* Header Section */
        .wall-header {
            background: var(--bg-dark);
            border: 2px solid var(--eva-purple);
            padding: 3rem 2rem;
            margin-bottom: 2rem;
            position: relative;
            text-align: center;
        }

        .corner-marks {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid var(--eva-orange);
        }

        .corner.top-left {
            top: 15px;
            left: 15px;
            border-right: none;
            border-bottom: none;
        }

        .corner.top-right {
            top: 15px;
            right: 15px;
            border-left: none;
            border-bottom: none;
        }

        .corner.bottom-left {
            bottom: 15px;
            left: 15px;
            border-right: none;
            border-top: none;
        }

        .corner.bottom-right {
            bottom: 15px;
            right: 15px;
            border-left: none;
            border-top: none;
        }

        .user-avatar {
            width: 100px;
            height: 100px;
            background: rgba(153, 51, 255, 0.2);
            border: 2px solid var(--eva-purple);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 0 auto 1.5rem;
        }

        .user-name {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 0.3rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px var(--eva-purple);
        }

        .user-telegram {
            font-size: 1rem;
            letter-spacing: 0.2rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .user-telegram.not-linked {
            color: var(--text-muted);
        }

        .telegram-icon {
            color: #0088cc;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 900;
            color: var(--eva-purple);
        }

        .stat-label {
            font-size: 0.8rem;
            letter-spacing: 0.1rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        /* Comment Form */
        .comment-form-section {
            background: var(--bg-dark);
            border: 2px solid var(--eva-orange);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .form-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.2rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-title::before {
            content: '';
            width: 40px;
            height: 3px;
            background: var(--eva-orange);
        }

        .comment-textarea {
            width: 100%;
            min-height: 120px;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            resize: vertical;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }

        .comment-textarea:focus {
            outline: none;
            border-color: var(--eva-purple);
            box-shadow: 0 0 10px rgba(153, 51, 255, 0.3);
        }

        .comment-textarea::placeholder {
            color: var(--text-muted);
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .char-counter {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 0.1rem;
        }

        .char-counter.warning {
            color: var(--eva-orange);
        }

        .char-counter.danger {
            color: var(--eva-red);
        }

        .submit-comment-btn {
            padding: 1rem 2.5rem;
            background: var(--eva-purple);
            border: none;
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .submit-comment-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s ease;
        }

        .submit-comment-btn:hover:not(:disabled) {
            box-shadow: 0 0 20px rgba(153, 51, 255, 0.5);
            transform: translateY(-2px);
        }

        .submit-comment-btn:hover:not(:disabled)::before {
            left: 100%;
        }

        .submit-comment-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Comments Section */
        .comments-section {
            margin-bottom: 2rem;
        }

        .section-header {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.2rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-header::before {
            content: '';
            width: 40px;
            height: 3px;
            background: var(--eva-green);
        }

        .comment-card {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            position: relative;
            transition: all 0.3s ease;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .comment-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 0;
            background: var(--eva-purple);
            transition: height 0.3s ease;
        }

        .comment-card:hover {
            border-color: var(--eva-purple);
            transform: translateX(5px);
        }

        .comment-card:hover::before {
            height: 100%;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .comment-author {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .author-avatar {
            width: 40px;
            height: 40px;
            background: rgba(153, 51, 255, 0.2);
            border: 1px solid var(--eva-purple);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .author-name {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.1rem;
            color: var(--eva-orange);
        }

        .comment-date {
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.05rem;
        }

        .comment-text {
            font-size: 1rem;
            line-height: 1.8;
            color: var(--text-secondary);
            letter-spacing: 0.05rem;
            word-wrap: break-word;
        }

        .no-comments {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
            font-size: 1.1rem;
            letter-spacing: 0.2rem;
        }

        .share-section {
            background: var(--bg-dark);
            border: 2px solid var(--eva-green);
            padding: 2rem;
            margin-top: 2rem;
            text-align: center;
        }

        .share-title {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.2rem;
            margin-bottom: 1.5rem;
            color: var(--eva-green);
        }

        .share-url-container {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .share-url {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            outline: none;
        }

        .copy-btn {
            padding: 0.75rem 1.5rem;
            background: var(--eva-green);
            border: none;
            color: var(--bg-dark);
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: #00cc00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
        }

        .copy-btn.copied {
            background: var(--eva-purple);
        }

        .share-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .share-btn {
            padding: 1rem 2rem;
            background: rgba(153, 51, 255, 0.1);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .share-btn:hover {
            border-color: var(--eva-purple);
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(153, 51, 255, 0.3);
        }

        .share-btn.telegram:hover {
            border-color: #0088cc;
            box-shadow: 0 0 15px rgba(0, 136, 204, 0.3);
        }

        .share-btn.vk:hover {
            border-color: #0077ff;
            box-shadow: 0 0 15px rgba(0, 119, 255, 0.3);
        }

        .share-header-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            padding: 0.75rem 1.5rem;
            background: var(--eva-green);
            border: none;
            color: var(--bg-dark);
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 10;
        }

        .share-header-btn:hover {
            background: #00cc00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
            transform: translateY(-2px);
        }

        .empty-state-share {
            background: rgba(0, 255, 0, 0.05);
            border: 2px solid var(--eva-green);
            padding: 2rem;
            margin-top: 2rem;
        }

        .back-link {
            position: fixed;
            top: 2rem;
            left: 2rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1rem;
            letter-spacing: 0.1rem;
            transition: all 0.3s ease;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--bg-dark);
            padding: 0.75rem 1.5rem;
            border: 1px solid var(--border-color);
        }

        .back-link:hover {
            color: var(--eva-purple);
            border-color: var(--eva-purple);
            transform: translateX(-5px);
        }

        .success-message {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid var(--eva-green);
            padding: 1rem;
            margin-bottom: 1rem;
            color: var(--eva-green);
            font-size: 0.9rem;
            letter-spacing: 0.1rem;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .success-message.active {
            display: block;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .wall-header {
                padding: 2rem 1rem;
            }

            .user-name {
                font-size: 1.8rem;
                letter-spacing: 0.2rem;
            }

            .stats-bar {
                gap: 1.5rem;
            }

            .form-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .submit-comment-btn {
                width: 100%;
            }

            .back-link {
                top: 1rem;
                left: 1rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="eva-grid"></div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">ЗАГРУЗКА ДАННЫХ...</div>
    </div>

    <a href="index.html" class="back-link">
        <span>←</span>
        <span>ГЛАВНАЯ</span>
    </a>

    <div class="container" id="mainContainer" style="display: none;">
        <!-- User Header -->
        <div class="wall-header">
            <div class="corner-marks">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
            </div>

            <button class="share-header-btn" id="shareHeaderBtn">
                <span>🔗</span>
                <span>ПОДЕЛИТЬСЯ</span>
            </button>

            <div class="user-avatar" id="userAvatar">👤</div>
            <h1 class="user-name" id="userName">LOADING...</h1>
            <div class="user-telegram" id="userTelegram">
                <span>⏳ ЗАГРУЗКА...</span>
            </div>

            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-number" id="commentsCount">0</div>
                    <div class="stat-label">ЗАПИСЕЙ</div>
                </div>
            </div>
        </div>

        <!-- Comment Form -->
        <div class="comment-form-section">
            <div class="success-message" id="successMessage">
                ✓ КОММЕНТАРИЙ УСПЕШНО ОТПРАВЛЕН
            </div>
            
            <h2 class="form-title">НАПИСАТЬ НА СТЕНУ</h2>
            <form id="commentForm">
                <textarea 
                    id="commentText" 
                    class="comment-textarea" 
                    placeholder="Напиши что-нибудь на стену..."
                    maxlength="500"
                    required
                ></textarea>
                <div class="form-actions">
                    <div class="char-counter" id="charCounter">0 / 500</div>
                    <button type="submit" class="submit-comment-btn" id="submitBtn">
                        ОТПРАВИТЬ →
                    </button>
                </div>
            </form>
        </div>

        <!-- Comments List -->
        <div class="comments-section">
            <h2 class="section-header">ЗАПИСИ НА СТЕНЕ</h2>
            <div id="commentsList">
                <!-- Комментарии будут добавляться сюда -->
            </div>
        </div>

        <!-- Share Section -->
        <div class="share-section" id="shareSection">
            <h3 class="share-title">📤 ПОДЕЛИСЬ СВОЕЙ СТЕНОЙ</h3>
            <div class="share-url-container">
                <input type="text" class="share-url" id="shareUrl" readonly>
                <button class="copy-btn" id="copyBtn">КОПИРОВАТЬ</button>
            </div>
            <div class="share-buttons">
                <a href="#" class="share-btn telegram" id="shareTelegram" target="_blank">
                    <span>📱</span>
                    <span>TELEGRAM</span>
                </a>
                <a href="#" class="share-btn vk" id="shareVk" target="_blank">
                    <span>🌐</span>
                    <span>VK</span>
                </a>
                <button class="share-btn" id="shareNative">
                    <span>📲</span>
                    <span>ПОДЕЛИТЬСЯ</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Конфигурация API
        const API_BASE_URL = '/api'; // Измените на ваш URL API
        
        // Получаем username из URL (например: wall.html?user=alex_raven)
        const urlParams = new URLSearchParams(window.location.search);
        const targetUsername = urlParams.get('user');

        // Состояние приложения
        let userData = null;
        let comments = [];

        // Инициализация
        async function init() {
            if (!targetUsername) {
                showError('Пользователь не указан', 'Добавьте ?user=username в URL');
                return;
            }

            try {
                await loadWallData();
                hideLoading();
                setupEventListeners();
            } catch (error) {
                console.error('Ошибка инициализации:', error);
                showError('Ошибка загрузки', error.message);
            }
        }

        // Загрузка данных стены
        async function loadWallData() {
            try {
                // Запрос данных пользователя и комментариев
                const response = await fetch(`${API_BASE_URL}/wall/${targetUsername}`);
                
                if (!response.ok) {
                    throw new Error(`Пользователь не найден (${response.status})`);
                }

                const data = await response.json();
                
                // Ожидаемая структура JSON:
                // {
                //   "user": {
                //     "user_name": "alex_raven",
                //     "telegram": "@alex_raven" или null
                //   },
                //   "comments": [
                //     {
                //       "user_name": "friend_user",
                //       "comment": "Текст комментария",
                //       "time": "2026-01-18T10:15:00Z"
                //     }
                //   ]
                // }

                userData = data.user;
                comments = data.comments || [];

                renderUserData();
                renderComments();

            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                throw error;
            }
        }

        // Отрисовка данных пользователя
        function renderUserData() {
            if (!userData) return;

            document.getElementById('userName').textContent = userData.user_name.toUpperCase();
            document.getElementById('userAvatar').textContent = getAvatarEmoji(userData.user_name);
            
            const telegramElement = document.getElementById('userTelegram');
            if (userData.telegram) {
                telegramElement.innerHTML = `
                    <span class="telegram-icon">📱</span>
                    <span>${userData.telegram}</span>
                `;
                telegramElement.classList.remove('not-linked');
            } else {
                telegramElement.innerHTML = `
                    <span>⚠ TELEGRAM НЕ ПРИВЯЗАН</span>
                `;
                telegramElement.classList.add('not-linked');
            }

            // Обновляем title страницы
            document.title = `Wall - ${userData.user_name}`;
        }

        // Отрисовка комментариев
        function renderComments() {
            const commentsList = document.getElementById('commentsList');
            const commentsCount = document.getElementById('commentsCount');
            
            commentsCount.textContent = comments.length;

            if (comments.length === 0) {
                commentsList.innerHTML = `
                    <div class="no-comments">
                        <p>⚠ НА СТЕНЕ ПОКА НЕТ ЗАПИСЕЙ</p>
                        <p style="margin-top: 1rem; font-size: 0.9rem;">БУДЬ ПЕРВЫМ, КТО НАПИШЕТ ЧТО-ТО!</p>
                        
                        <div class="empty-state-share">
                            <p style="font-size: 1.1rem; color: var(--eva-green); margin-bottom: 1rem;">
                                💡 ПОДЕЛИСЬ ССЫЛКОЙ С ДРУЗЬЯМИ
                            </p>
                            <p style="font-size: 0.9rem; color: var(--text-secondary);">
                                Отправь им ссылку на свою стену, чтобы они могли оставить первые записи!
                            </p>
                        </div>
                    </div>
                `;
                return;
            }

            // Сортируем комментарии по дате (новые сверху)
            const sortedComments = [...comments].sort((a, b) => 
                new Date(b.time) - new Date(a.time)
            );

            commentsList.innerHTML = sortedComments.map(comment => `
                <div class="comment-card">
                    <div class="comment-header">
                        <div class="comment-author">
                            <div class="author-avatar">${getAvatarEmoji(comment.user_name)}</div>
                            <div class="author-name">${escapeHtml(comment.user_name).toUpperCase()}</div>
                        </div>
                        <div class="comment-date">${formatDate(comment.time)}</div>
                    </div>
                    <div class="comment-text">${escapeHtml(comment.comment)}</div>
                </div>
            `).join('');
        }

        // Настройка обработчиков событий
        function setupEventListeners() {
            const commentForm = document.getElementById('commentForm');
            const commentText = document.getElementById('commentText');
            const charCounter = document.getElementById('charCounter');
            const submitBtn = document.getElementById('submitBtn');

            // Настройка кнопок "Поделиться"
            setupShareButtons();

            // Счетчик символов
            commentText.addEventListener('input', () => {
                const length = commentText.value.length;
                charCounter.textContent = `${length} / 500`;

                charCounter.classList.remove('warning', 'danger');
                if (length > 400) charCounter.classList.add('warning');
                if (length > 450) charCounter.classList.add('danger');
            });

            // Отправка комментария
            commentForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const text = commentText.value.trim();
                if (!text) return;

                submitBtn.disabled = true;
                submitBtn.textContent = 'ОТПРАВКА...';

                try {
                    await postComment(text);
                    
                    // Показываем сообщение об успехе
                    showSuccess();
                    
                    // Очищаем форму
                    commentText.value = '';
                    charCounter.textContent = '0 / 500';
                    charCounter.classList.remove('warning', 'danger');
                    
                    // Перезагружаем комментарии
                    await loadWallData();
                    
                } catch (error) {
                    console.error('Ошибка отправки комментария:', error);
                    alert('Ошибка: ' + error.message);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'ОТПРАВИТЬ →';
                }
            });
        }

        // Настройка кнопок "Поделиться"
        function setupShareButtons() {
            const currentUrl = window.location.href;
            const shareUrl = document.getElementById('shareUrl');
            const copyBtn = document.getElementById('copyBtn');
            const shareHeaderBtn = document.getElementById('shareHeaderBtn');
            const shareTelegram = document.getElementById('shareTelegram');
            const shareVk = document.getElementById('shareVk');
            const shareNative = document.getElementById('shareNative');

            // Устанавливаем URL
            shareUrl.value = currentUrl;

            // Копирование ссылки
            copyBtn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(currentUrl);
                    const originalText = copyBtn.textContent;
                    copyBtn.textContent = '✓ СКОПИРОВАНО';
                    copyBtn.classList.add('copied');
                    
                    setTimeout(() => {
                        copyBtn.textContent = originalText;
                        copyBtn.classList.remove('copied');
                    }, 2000);
                } catch (error) {
                    // Fallback для старых браузеров
                    shareUrl.select();
                    document.execCommand('copy');
                    copyBtn.textContent = '✓ СКОПИРОВАНО';
                }
            });

            // Кнопка "Поделиться" в шапке - скролл к секции
            shareHeaderBtn.addEventListener('click', () => {
                document.getElementById('shareSection').scrollIntoView({ 
                    behavior: 'smooth',
                    block: 'center'
                });
            });

            // Telegram share
            const shareText = `Посмотри мою стену в Wall! 🧱`;
            shareTelegram.href = `https://t.me/share/url?url=${encodeURIComponent(currentUrl)}&text=${encodeURIComponent(shareText)}`;

            // VK share
            shareVk.href = `https://vk.com/share.php?url=${encodeURIComponent(currentUrl)}&title=${encodeURIComponent(shareText)}`;

            // Native share (для мобильных)
            shareNative.addEventListener('click', async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: `Wall - ${userData?.user_name || 'Стена пользователя'}`,
                            text: shareText,
                            url: currentUrl
                        });
                    } catch (error) {
                        if (error.name !== 'AbortError') {
                            console.error('Ошибка share:', error);
                        }
                    }
                } else {
                    // Fallback - копируем ссылку
                    copyBtn.click();
                }
            });
        }

        // Отправка комментария на сервер
        async function postComment(commentText) {
            const response = await fetch(`${API_BASE_URL}/wall/${targetUsername}/comment`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    comment: commentText
                    // user_name будет определен на сервере из сессии/токена
                })
            });

            if (!response.ok) {
                throw new Error(`Ошибка отправки (${response.status})`);
            }

            return await response.json();
        }

        // Показать сообщение об успехе
        function showSuccess() {
            const successMessage = document.getElementById('successMessage');
            successMessage.classList.add('active');
            setTimeout(() => {
                successMessage.classList.remove('active');
            }, 3000);
        }

        // Форматирование даты
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);

            if (minutes < 1) return 'ТОЛЬКО ЧТО';
            if (minutes < 60) return `${minutes} МИН НАЗАД`;
            if (hours < 24) return `${hours} Ч НАЗАД`;
            if (days < 7) return `${days} ДН НАЗАД`;

            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}.${month}.${year}`;
        }

        // Генерация аватара из username
        function getAvatarEmoji(username) {
            const emojis = ['👤', '👨', '👩', '🧑', '👨‍💻', '👩‍💻', '🎭', '🎮', '🎨', '🎯', '⚡', '🔥', '💫', '🌟', '👑'];
            const hash = username.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            return emojis[hash % emojis.length];
        }

        // Экранирование HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Показать ошибку
        function showError(title, message) {
            hideLoading();
            const container = document.getElementById('mainContainer');
            container.style.display = 'block';
            container.innerHTML = `
                <div class="error-container">
                    <div class="error-icon">⚠</div>
                    <div class="error-title">${title}</div>
                    <div class="error-message">${message}</div>
                </div>
            `;
        }

        // Скрыть загрузку
        function hideLoading() {
            const loading = document.getElementById('loadingOverlay');
            const container = document.getElementById('mainContainer');
            loading.classList.add('hidden');
            container.style.display = 'block';
        }

        // Запуск при загрузке страницы
        init();

        // Console easter egg
        console.log('%c WALL SYSTEM ACTIVE ', 'background: #9933ff; color: #fff; font-size: 16px; padding: 5px;');
        console.log(`%c LOADING WALL: ${targetUsername} `, 'background: #00ff00; color: #000; font-size: 12px; padding: 5px;');
    </script>
</body>
</html>
