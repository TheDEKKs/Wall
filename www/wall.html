<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wall - Стена пользователя</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --eva-purple: #9933ff;
            --eva-orange: #ff6600;
            --eva-green: #00ff00;
            --eva-red: #ff0000;
            --bg-dark: #0a0a0a;
            --bg-darker: #000000;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --text-muted: #666666;
            --border-color: #333333;
            --warning-yellow: #ffff00;
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--bg-darker);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
        }

        .eva-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(153, 51, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(153, 51, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        /* Loading State */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-darker);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid var(--border-color);
            border-top-color: var(--eva-purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 1.5rem;
            font-size: 1rem;
            letter-spacing: 0.2rem;
            color: var(--text-muted);
        }

        /* Error State */
        .error-container {
            background: rgba(255, 0, 0, 0.1);
            border: 2px solid var(--eva-red);
            padding: 3rem 2rem;
            text-align: center;
            margin: 4rem auto;
            max-width: 600px;
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.2rem;
            margin-bottom: 1rem;
            color: var(--eva-red);
        }

        .error-message {
            color: var(--text-secondary);
            letter-spacing: 0.1rem;
        }

        /* Back Button */
        .back-button {
            position: fixed;
            top: 2rem;
            left: 2rem;
            padding: 0.75rem 1.5rem;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1rem;
            letter-spacing: 0.1rem;
            transition: all 0.3s ease;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-button:hover {
            color: var(--eva-purple);
            border-color: var(--eva-purple);
            transform: translateX(-5px);
        }

        /* Header Section */
        .wall-header {
            background: var(--bg-dark);
            border: 2px solid var(--eva-purple);
            padding: 3rem 2rem 2rem;
            margin-bottom: 2rem;
            position: relative;
            text-align: center;
        }

        .corner-marks {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid var(--eva-orange);
        }

        .corner.top-left {
            top: 15px;
            left: 15px;
            border-right: none;
            border-bottom: none;
        }

        .corner.top-right {
            top: 15px;
            right: 15px;
            border-left: none;
            border-bottom: none;
        }

        .corner.bottom-left {
            bottom: 15px;
            left: 15px;
            border-right: none;
            border-top: none;
        }

        .corner.bottom-right {
            bottom: 15px;
            right: 15px;
            border-left: none;
            border-top: none;
        }

        .user-avatar {
            width: 100px;
            height: 100px;
            background: rgba(153, 51, 255, 0.2);
            border: 2px solid var(--eva-purple);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 0 auto 1.5rem;
        }

        .user-name {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 0.3rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px var(--eva-purple);
        }

        .user-stats {
            font-size: 1rem;
            letter-spacing: 0.2rem;
            color: var(--text-muted);
            margin-top: 1rem;
        }

        .telegram-profile {
            display: block;
            text-decoration: none;
            margin-top: 1rem;
            padding: 1rem;
            border: 1px solid var(--border-color);
            background: rgba(0, 136, 204, 0.05);
            transition: all 0.3s ease;
            max-width: 400px;
            margin: 1rem auto 0;
        }

        .telegram-profile:hover {
            border-color: #0088cc;
            background: rgba(0, 136, 204, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(0, 136, 204, 0.3);
        }

        .telegram-name {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.1rem;
            color: var(--text-primary);
            margin-bottom: 0.3rem;
        }

        .telegram-username {
            font-size: 0.9rem;
            color: #0088cc;
            letter-spacing: 0.05rem;
        }

        .telegram-username::before {
            content: '@';
        }

        /* Share Section */
        .share-section {
            background: var(--bg-dark);
            border: 2px solid var(--border-color);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .share-title {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.2rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .share-url-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .share-url-input {
            flex: 1;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        .copy-btn {
            padding: 1rem 2rem;
            background: var(--eva-purple);
            border: none;
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            font-weight: 700;
            letter-spacing: 0.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: var(--eva-orange);
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.5);
        }

        .copy-btn.copied {
            background: var(--eva-green);
        }

        .share-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .share-btn {
            padding: 1rem 1.5rem;
            background: rgba(153, 51, 255, 0.1);
            border: 1px solid var(--eva-purple);
            color: var(--text-primary);
            text-decoration: none;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            letter-spacing: 0.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .share-btn:hover {
            background: rgba(153, 51, 255, 0.2);
            border-color: var(--eva-orange);
            transform: translateY(-2px);
        }

        /* Comment Form */
        .comment-form-section {
            background: var(--bg-dark);
            border: 2px solid var(--eva-purple);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .form-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.2rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .comment-textarea {
            width: 100%;
            min-height: 150px;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            resize: vertical;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .comment-textarea:focus {
            outline: none;
            border-color: var(--eva-purple);
            box-shadow: 0 0 10px rgba(153, 51, 255, 0.3);
        }

        .comment-textarea::placeholder {
            color: var(--text-muted);
        }

        .char-counter {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: right;
            margin-bottom: 1rem;
            letter-spacing: 0.1rem;
        }

        .char-counter.warning {
            color: var(--eva-orange);
        }

        .char-counter.error {
            color: var(--eva-red);
        }

        .submit-comment-btn {
            width: 100%;
            padding: 1.5rem;
            background: var(--eva-purple);
            border: none;
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .submit-comment-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s ease;
        }

        .submit-comment-btn:hover:not(:disabled) {
            box-shadow: 0 0 20px rgba(153, 51, 255, 0.5);
            transform: translateY(-2px);
        }

        .submit-comment-btn:hover:not(:disabled)::before {
            left: 100%;
        }

        .submit-comment-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Comments Section */
        .comments-section {
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.2rem;
            margin-bottom: 1.5rem;
            padding-left: 1rem;
            border-left: 3px solid var(--eva-purple);
        }

        .comment-card {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 2rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .comment-card:hover {
            border-color: var(--eva-purple);
            transform: translateX(5px);
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .comment-author {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.1rem;
            color: var(--eva-purple);
        }

        .comment-date {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 0.05rem;
        }

        .comment-text {
            font-size: 1rem;
            line-height: 1.8;
            color: var(--text-secondary);
            letter-spacing: 0.05rem;
            word-wrap: break-word;
        }

        .no-comments {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
            font-size: 1.2rem;
            letter-spacing: 0.2rem;
        }

        /* Success Message */
        .success-message {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid var(--eva-green);
            padding: 1.5rem 2rem;
            color: var(--eva-green);
            font-weight: 700;
            letter-spacing: 0.2rem;
            z-index: 1000;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .success-message.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Error Modal */
        .error-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .error-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .error-modal-content {
            background: var(--bg-dark);
            border: 2px solid var(--eva-red);
            max-width: 500px;
            width: 90%;
            padding: 2rem;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 40px;
            height: 40px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--eva-red);
            transform: rotate(90deg);
        }

        .error-modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.2rem;
            margin-bottom: 1rem;
            color: var(--eva-red);
            text-align: center;
        }

        .error-modal-text {
            font-size: 1rem;
            line-height: 1.8;
            color: var(--text-secondary);
            text-align: center;
            letter-spacing: 0.1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .back-button {
                top: 1rem;
                left: 1rem;
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
            }

            .wall-header {
                padding: 2rem 1.5rem 1.5rem;
            }

            .user-name {
                font-size: 1.8rem;
                letter-spacing: 0.2rem;
            }

            .user-avatar {
                width: 80px;
                height: 80px;
                font-size: 2rem;
            }

            .share-url-container {
                flex-direction: column;
            }

            .copy-btn {
                width: 100%;
            }

            .share-buttons {
                flex-direction: column;
            }

            .share-btn {
                width: 100%;
                justify-content: center;
            }

            .comment-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }

            .success-message {
                bottom: 1rem;
                right: 1rem;
                left: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="eva-grid"></div>
    
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">ЗАГРУЗКА СТЕНЫ...</div>
    </div>

    <!-- Back Button -->
    <a href="index.html" class="back-button">
        <span>←</span>
        <span>НАЗАД</span>
    </a>

    <!-- Main Container -->
    <div class="container" id="mainContainer" style="display: none;">
        <!-- Wall Header -->
        <div class="wall-header">
            <div class="corner-marks">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
            </div>

            <div class="user-avatar" id="userAvatar">👤</div>
            <h1 class="user-name" id="userName">LOADING...</h1>
            <div class="user-stats" id="userStats">СООБЩЕНИЙ: 0</div>
            
            <!-- Telegram Profile (if available) -->
            <a href="#" class="telegram-profile" id="telegramProfile" style="display: none;" target="_blank">
                <div class="telegram-name" id="telegramName"></div>
                <div class="telegram-username" id="telegramUsername"></div>
            </a>
        </div>

        <!-- Share Section -->
        <div class="share-section">
            <h2 class="share-title">ПОДЕЛИТЬСЯ СТЕНОЙ</h2>
            <div class="share-url-container">
                <input type="text" class="share-url-input" id="shareUrl" readonly>
                <button class="copy-btn" id="copyBtn">КОПИРОВАТЬ</button>
            </div>
            <div class="share-buttons">
                <a href="#" class="share-btn" id="shareTelegram" target="_blank">
                    <span>📱</span>
                    <span>TELEGRAM</span>
                </a>
                <a href="#" class="share-btn" id="shareVk" target="_blank">
                    <span>🔵</span>
                    <span>VKONTAKTE</span>
                </a>
                <button class="share-btn" id="shareNative">
                    <span>📤</span>
                    <span>ПОДЕЛИТЬСЯ</span>
                </button>
            </div>
        </div>

        <!-- Comment Form -->
        <div class="comment-form-section">
            <h2 class="form-title">ОСТАВИТЬ СООБЩЕНИЕ</h2>
            <form id="commentForm">
                <textarea 
                    class="comment-textarea" 
                    id="commentText" 
                    placeholder="Напишите сообщение на стену..."
                    maxlength="500"
                    required
                ></textarea>
                <div class="char-counter" id="charCounter">0 / 500</div>
                <button type="submit" class="submit-comment-btn" id="submitBtn">
                    ОТПРАВИТЬ →
                </button>
            </form>
        </div>

        <!-- Comments Section -->
        <div class="comments-section">
            <h2 class="section-title">СООБЩЕНИЯ НА СТЕНЕ</h2>
            <div id="commentsContainer">
                <div class="no-comments">
                    НА СТЕНЕ ПОКА НЕТ СООБЩЕНИЙ<br>
                    БУДЬТЕ ПЕРВЫМ!
                </div>
            </div>
        </div>
    </div>

    <!-- Success Message -->
    <div class="success-message" id="successMessage">
        ✓ СООБЩЕНИЕ ОТПРАВЛЕНО!
    </div>

    <!-- Error Modal -->
    <div class="error-modal" id="errorModal">
        <div class="error-modal-content">
            <button class="modal-close" id="closeErrorModal">×</button>
            <h3 class="error-modal-title">ОШИБКА</h3>
            <p class="error-modal-text" id="errorModalText">Произошла ошибка</p>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8888';
        let targetUsername = '';
        let userData = null;

        // Инициализация
        async function init() {
            // Получить username из URL
            const urlParams = new URLSearchParams(window.location.search);
            targetUsername = urlParams.get('user');

            if (!targetUsername) {
                showError('ОШИБКА', 'Не указан пользователь');
                return;
            }

            // Загрузить данные стены
            await loadWall();
            
            // Настроить форму комментария
            setupCommentForm();
            
            // Настроить кнопки "Поделиться"
            setupShareButtons();
        }

        // Загрузка данных стены
        async function loadWall() {
            try {
                const response = await fetch(`${API_BASE_URL}/${targetUsername}`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                if (response.status === 404) {
                    showError('ПОЛЬЗОВАТЕЛЬ НЕ НАЙДЕН', `Пользователь ${targetUsername} не существует`);
                    return;
                }

                if (!response.ok) {
                    showError('ОШИБКА ЗАГРУЗКИ', 'Не удалось загрузить данные стены');
                    return;
                }

                const data = await response.json();
                userData = data;

                // Отобразить данные
                displayWall(data);
                hideLoading();

            } catch (error) {
                console.error('Load wall error:', error);
                showError('ОШИБКА СОЕДИНЕНИЯ', 'Не удалось подключиться к серверу');
            }
        }

        // Отображение данных стены
        function displayWall(data) {
            // Имя пользователя
            document.getElementById('userName').textContent = data.user_name || targetUsername;
            
            // Аватар
            document.getElementById('userAvatar').textContent = getAvatarEmoji(data.user_name || targetUsername);
            
            // Статистика
            document.getElementById('userStats').textContent = `СООБЩЕНИЙ: ${data.number_of_records || 0}`;

            // Telegram профиль
            if (data.user_name_telegram) {
                const telegramProfile = document.getElementById('telegramProfile');
                const telegramName = document.getElementById('telegramName');
                const telegramUsername = document.getElementById('telegramUsername');
                
                const fullName = [data.first_name_telegram, data.last_name_telegram]
                    .filter(Boolean)
                    .join(' ') || 'Telegram User';
                
                telegramName.textContent = fullName;
                telegramUsername.textContent = data.user_name_telegram;
                telegramProfile.href = `https://t.me/${data.user_name_telegram}`;
                telegramProfile.style.display = 'block';
            }

            // Комментарии
            displayComments(data.Comments || []);
        }

        // Отображение комментариев
        function displayComments(comments) {
            const container = document.getElementById('commentsContainer');
            
            if (!comments || comments.length === 0) {
                container.innerHTML = `
                    <div class="no-comments">
                        НА СТЕНЕ ПОКА НЕТ СООБЩЕНИЙ<br>
                        БУДЬТЕ ПЕРВЫМ!
                    </div>
                `;
                return;
            }

            // Сортировать по дате (новые первыми)
            const sortedComments = [...comments].sort((a, b) => {
                return new Date(b.created_at) - new Date(a.created_at);
            });

            container.innerHTML = sortedComments.map(comment => `
                <div class="comment-card">
                    <div class="comment-header">
                        <span class="comment-author">${escapeHtml(comment.user_name || 'Аноним')}</span>
                        <span class="comment-date">${formatDate(comment.created_at)}</span>
                    </div>
                    <div class="comment-text">${escapeHtml(comment.comment)}</div>
                </div>
            `).join('');
        }

        // Настройка формы комментария
        function setupCommentForm() {
            const commentText = document.getElementById('commentText');
            const charCounter = document.getElementById('charCounter');
            const commentForm = document.getElementById('commentForm');
            const submitBtn = document.getElementById('submitBtn');

            // Счетчик символов
            commentText.addEventListener('input', () => {
                const length = commentText.value.length;
                charCounter.textContent = `${length} / 500`;
                
                if (length > 450) {
                    charCounter.classList.add('error');
                    charCounter.classList.remove('warning');
                } else if (length > 400) {
                    charCounter.classList.add('warning');
                    charCounter.classList.remove('error');
                } else {
                    charCounter.classList.remove('warning', 'error');
                }
            });

            // Отправка формы
            commentForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const text = commentText.value.trim();
                
                if (!text) {
                    showErrorModal('Введите текст сообщения');
                    return;
                }

                if (text.length > 500) {
                    showErrorModal('Сообщение слишком длинное (максимум 500 символов)');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'ОТПРАВКА...';

                try {
                    await postComment(text);
                    
                    // Успешно отправлено
                    commentText.value = '';
                    charCounter.textContent = '0 / 500';
                    charCounter.classList.remove('warning', 'error');
                    showSuccess();
                    
                    // Перезагрузить стену
                    await loadWall();
                    
                } catch (error) {
                    showErrorModal(error.message || 'Не удалось отправить сообщение');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'ОТПРАВИТЬ →';
                }
            });
        }

        // Отправка комментария на сервер
        async function postComment(commentText) {
            try {
                const response = await fetch(`${API_BASE_URL}/comment/new/${targetUsername}`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        comment: commentText
                    })
                });

                if (response.status === 401) {
                    throw new Error('Вы не авторизованы. Войдите в аккаунт.');
                }

                if (response.status === 409 || response.status === 400) {
                    const errorData = await response.json().catch(() => ({}));
                    const errorMsg = errorData.message || errorData.detail || 'Вы уже оставили комментарий на этой стене';
                    throw new Error(errorMsg);
                }

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    const errorMsg = errorData.message || errorData.detail || `Ошибка отправки (${response.status})`;
                    throw new Error(errorMsg);
                }

                return { success: true };
                
            } catch (error) {
                console.error('Post comment error:', error);
                throw error;
            }
        }

        // Настройка кнопок "Поделиться"
        function setupShareButtons() {
            const currentUrl = window.location.href;
            const shareUrl = document.getElementById('shareUrl');
            const copyBtn = document.getElementById('copyBtn');
            const shareTelegram = document.getElementById('shareTelegram');
            const shareVk = document.getElementById('shareVk');
            const shareNative = document.getElementById('shareNative');

            shareUrl.value = currentUrl;

            // Копирование ссылки
            copyBtn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(currentUrl);
                    const originalText = copyBtn.textContent;
                    copyBtn.textContent = '✓ СКОПИРОВАНО';
                    copyBtn.classList.add('copied');
                    
                    setTimeout(() => {
                        copyBtn.textContent = originalText;
                        copyBtn.classList.remove('copied');
                    }, 2000);
                } catch (error) {
                    shareUrl.select();
                    document.execCommand('copy');
                    copyBtn.textContent = '✓ СКОПИРОВАНО';
                }
            });

            // Telegram share
            const shareText = `Посмотри мою стену в Wall! 🧱`;
            shareTelegram.href = `https://t.me/share/url?url=${encodeURIComponent(currentUrl)}&text=${encodeURIComponent(shareText)}`;

            // VK share
            shareVk.href = `https://vk.com/share.php?url=${encodeURIComponent(currentUrl)}&title=${encodeURIComponent(shareText)}`;

            // Native share
            shareNative.addEventListener('click', async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: `Wall - ${userData?.user_name || 'Стена пользователя'}`,
                            text: shareText,
                            url: currentUrl
                        });
                    } catch (error) {
                        if (error.name !== 'AbortError') {
                            console.error('Share error:', error);
                        }
                    }
                } else {
                    copyBtn.click();
                }
            });
        }

        // Показать сообщение об успехе
        function showSuccess() {
            const successMessage = document.getElementById('successMessage');
            successMessage.classList.add('active');
            setTimeout(() => {
                successMessage.classList.remove('active');
            }, 3000);
        }

        // Показать модальное окно с ошибкой
        function showErrorModal(message) {
            const errorModal = document.getElementById('errorModal');
            const errorModalText = document.getElementById('errorModalText');
            
            errorModalText.textContent = message;
            errorModal.classList.add('active');
        }

        // Закрытие модального окна
        document.addEventListener('DOMContentLoaded', () => {
            const closeErrorModal = document.getElementById('closeErrorModal');
            const errorModal = document.getElementById('errorModal');
            
            if (closeErrorModal) {
                closeErrorModal.addEventListener('click', () => {
                    errorModal.classList.remove('active');
                });
            }
            
            if (errorModal) {
                errorModal.addEventListener('click', (e) => {
                    if (e.target === errorModal) {
                        errorModal.classList.remove('active');
                    }
                });
            }
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && errorModal.classList.contains('active')) {
                    errorModal.classList.remove('active');
                }
            });
        });

        // Форматирование даты
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);

            if (minutes < 1) return 'ТОЛЬКО ЧТО';
            if (minutes < 60) return `${minutes} МИН НАЗАД`;
            if (hours < 24) return `${hours} Ч НАЗАД`;
            if (days < 7) return `${days} ДН НАЗАД`;

            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}.${month}.${year}`;
        }

        // Генерация аватара из username
        function getAvatarEmoji(username) {
            const emojis = ['👤', '👨', '👩', '🧑', '👨‍💻', '👩‍💻', '🎭', '🎮', '🎨', '🎯', '⚡', '🔥', '💫', '🌟', '👑'];
            const hash = username.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            return emojis[hash % emojis.length];
        }

        // Экранирование HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Показать ошибку
        function showError(title, message) {
            hideLoading();
            const container = document.getElementById('mainContainer');
            container.style.display = 'block';
            
            let errorHtml = `
                <div class="error-container">
                    <div class="error-icon">⚠</div>
                    <div class="error-title">${title}</div>
                    <div class="error-message">${message}</div>
            `;

            if (title.includes('НЕ НАЙДЕН')) {
                errorHtml += `
                    <div style="margin-top: 2rem;">
                        <button onclick="window.location.href='index.html'" style="
                            padding: 1rem 2rem;
                            background: var(--eva-purple);
                            border: none;
                            color: white;
                            font-family: 'Courier New', monospace;
                            font-size: 1rem;
                            cursor: pointer;
                            letter-spacing: 0.2rem;
                        ">
                            НА ГЛАВНУЮ
                        </button>
                    </div>
                `;
            }

            errorHtml += `</div>`;
            container.innerHTML = errorHtml;
        }

        // Скрыть загрузку
        function hideLoading() {
            const loading = document.getElementById('loadingOverlay');
            const container = document.getElementById('mainContainer');
            loading.classList.add('hidden');
            container.style.display = 'block';
        }

        // Запуск при загрузке страницы
        init();

        // Console easter egg
        console.log('%c WALL SYSTEM ACTIVE ', 'background: #9933ff; color: #fff; font-size: 16px; padding: 5px;');
        console.log(`%c LOADING WALL: ${targetUsername} `, 'background: #00ff00; color: #000; font-size: 12px; padding: 5px;');
    </script>
</body>
